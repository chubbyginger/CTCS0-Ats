[Vehicle]
; 车辆类型（内燃机车=0，内燃动车组=1，电力机车=2，电力动车组=3）
VehicleType=3
; 制动类型（自动制动机=0，直通制动机=1）
BrakeType=1
; 常用制动减速度 (km/h/s)
ServiceBrakeDeceleration=3.6
; 紧急制动减速度 (km/h/s)
EmergencyBrakeDeceleration=4.5
; 空走时间 (s)
EmptyRunTime=0.5
; 列车最高允许速度 (km/h)
MaxSpeed=130
; 制动管定压(kPa)，自动制动机用于计算减压量
BpNominalPressure=500

[DMI]
TexturePath=chubbyginger/InnoSig-E531/image/DMI.png
TextureWidth=1024
TextureHeight=1024
TargetFPS=10
; 强制机车信号显示，-1=不强制(使用实际信号)，0=HU,2=U,3=LU,4=L,5=L2,6=L3,7=L4,8=L5,9=H,10=HB,11=UU,12=UUS,13=U2,14=U2S,15=B
ForceCabSignal=-1
; 曲线前方显示距离(m)
CurveDisplayDistance=5000
; Y轴速度标尺(80/120/140/160 km/h)
CurveSpeedScale=120
; 停车区安全距离基本值A(m) - 站内
SafetyDistanceBaseServiceStation=50
SafetyDistanceBaseEmergencyStation=20
; 停车区安全距离基本值A(m) - 区间
SafetyDistanceBaseServiceSection=100
SafetyDistanceBaseEmergencySection=70
; 调试：显示紧急制动速度曲线
ShowEmergencyBrakeCurve=false
